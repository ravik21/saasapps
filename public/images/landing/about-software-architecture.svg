<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E9E9"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111111" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" rx="28" fill="url(#bg)"/>
  <circle cx="400" cy="325" r="290" fill="none" stroke="#DDDDDD" stroke-width="1.5"/>
  <circle cx="400" cy="325" r="230" fill="none" stroke="#E3E3E3" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- Browser window -->
  <g filter="url(#sh)">
    <rect x="110" y="110" width="580" height="400" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="110" y="110" width="580" height="400" rx="22" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>
  <circle cx="138" cy="131" r="5" fill="#D4D4D4"/>
  <circle cx="156" cy="131" r="5" fill="#D4D4D4"/>
  <circle cx="174" cy="131" r="5" fill="#D4D4D4"/>
  <rect x="230" y="120" width="260" height="22" rx="11" fill="#F3F3F3"/>
  <line x1="111" y1="152" x2="689" y2="152" stroke="#EEEEEE" stroke-width="1.5"/>

  <!-- Sidebar -->
  <rect x="111" y="153" width="90" height="356" fill="#FAFAFA"/>
  <rect x="128" y="170" width="30" height="30" rx="9" fill="#111111"/>
  <rect x="128" y="222" width="56" height="12" rx="6" fill="#111111"/>
  <rect x="128" y="252" width="44" height="12" rx="6" fill="#D9D9D9"/>
  <rect x="128" y="282" width="52" height="12" rx="6" fill="#D9D9D9"/>
  <rect x="128" y="312" width="38" height="12" rx="6" fill="#D9D9D9"/>

  <!-- Heading -->
  <rect x="222" y="172" width="150" height="14" rx="7" fill="#111111"/>
  <rect x="222" y="196" width="210" height="9" rx="4.5" fill="#D9D9D9"/>

  <!-- Stat cards -->
  <g>
    <rect x="222" y="226" width="135" height="72" rx="14" fill="#F6F6F6"/>
    <text x="238" y="250" font-size="11" fill="#8A8A8A">Users</text>
    <text x="238" y="278" font-size="22" font-weight="800" fill="#111111">24.8k</text>

    <rect x="369" y="226" width="135" height="72" rx="14" fill="#F6F6F6"/>
    <text x="385" y="250" font-size="11" fill="#8A8A8A">Uptime</text>
    <text x="385" y="278" font-size="22" font-weight="800" fill="#111111">99.9%</text>

    <rect x="516" y="226" width="135" height="72" rx="14" fill="#F6F6F6"/>
    <text x="532" y="250" font-size="11" fill="#8A8A8A">Response</text>
    <text x="532" y="278" font-size="22" font-weight="800" fill="#111111">120ms</text>
  </g>

  <!-- Chart card -->
  <rect x="222" y="314" width="429" height="178" rx="16" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="1.5"/>
  <line x1="242" y1="368" x2="631" y2="368" stroke="#F0F0F0" stroke-width="1.5"/>
  <line x1="242" y1="408" x2="631" y2="408" stroke="#F0F0F0" stroke-width="1.5"/>
  <line x1="242" y1="448" x2="631" y2="448" stroke="#F0F0F0" stroke-width="1.5"/>
  <path d="M242 450 L290 432 L340 442 L390 398 L440 408 L490 368 L540 378 L590 342 L631 346 L631 470 L242 470 Z" fill="url(#area)"/>
  <path d="M242 450 L290 432 L340 442 L390 398 L440 408 L490 368 L540 378 L590 342 L631 346" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="631" cy="346" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3.5"/>
  <text x="242" y="340" font-size="12" font-weight="700" fill="#111111">Growth overview</text>

  <!-- Floating card: growth -->
  <g filter="url(#sh2)">
    <rect x="560" y="64" width="190" height="88" rx="20" fill="#111111"/>
  </g>
  <text x="582" y="95" font-size="12" fill="#9A9A9A">Monthly growth</text>
  <text x="582" y="134" font-size="32" font-weight="800" fill="#FFFFFF">+128%</text>
  <path d="M708 128 L722 112 L736 128" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating card: notification -->
  <g filter="url(#sh2)">
    <rect x="56" y="468" width="262" height="80" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="56" y="468" width="262" height="80" rx="20" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>
  <circle cx="98" cy="508" r="22" fill="#111111"/>
  <circle cx="98" cy="500" r="7" fill="#FFFFFF"/>
  <path d="M84 521 C84 511 112 511 112 521" fill="#FFFFFF"/>
  <text x="134" y="502" font-size="14" font-weight="700" fill="#111111">New project request</text>
  <text x="134" y="523" font-size="12" fill="#737373">Let's build it together</text>

  <!-- Check badge -->
  <g filter="url(#sh2)">
    <circle cx="704" cy="520" r="28" fill="#111111"/>
  </g>
  <path d="M691 520 L701 530 L718 510" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
