<svg width="800" height="640" viewBox="0 0 800 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="0" y="0" width="800" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#777777" />
    </marker>
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#E5E5E5" />
    </pattern>
  </defs>

  <!-- Outer Card Container -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="16" width="768" height="608" rx="24" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  </g>

  <!-- Subtle Blueprint Tech Grid inside canvas -->
  <rect x="24" y="24" width="752" height="592" rx="18" fill="url(#techGrid)" opacity="0.6"/>

  <!-- Header Bar of the Architecture Canvas -->
  <rect x="36" y="36" width="728" height="40" rx="10" fill="#F7F7F5" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="60" cy="56" r="4.5" fill="#D4D4D4"/>
  <circle cx="76" cy="56" r="4.5" fill="#D4D4D4"/>
  <circle cx="92" cy="56" r="4.5" fill="#D4D4D4"/>
  <text x="116" y="60" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#777777" letter-spacing="0.08em">SYSTEM ARCHITECTURE &amp; WORKFLOW TOPOLOGY</text>
  <rect x="640" y="46" width="108" height="20" rx="6" fill="#E5E5E5"/>
  <text x="652" y="60" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#222526">STATUS: ONLINE</text>

  <!-- 1. Top Tier: Client Ingestion (Web / Mobile / Webhook) -->
  <g transform="translate(250, 105)">
    <rect width="300" height="64" rx="12" fill="#FFFFFF" stroke="#222526" stroke-width="1.5"/>
    <rect x="16" y="18" width="28" height="28" rx="6" fill="#F1F1F1" stroke="#E5E5E5" stroke-width="1"/>
    <path d="M24 28h12M24 36h8" stroke="#222526" stroke-width="1.5" stroke-linecap="round"/>
    <text x="56" y="34" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111111">Client Applications &amp; Interfaces</text>
    <text x="56" y="49" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#777777">Web App • Mobile (iOS/Android) • Webhooks</text>
  </g>

  <!-- Connector Line 1: Client -> API Gateway -->
  <path d="M400 170 v40" stroke="#777777" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <circle cx="400" cy="170" r="3" fill="#222526"/>

  <!-- 2. Middle Tier: Central API Gateway & Load Balancer -->
  <g transform="translate(230, 215)">
    <rect width="340" height="76" rx="14" fill="#222526" stroke="#111111" stroke-width="2"/>
    <!-- Icon -->
    <rect x="18" y="20" width="36" height="36" rx="8" fill="#333738"/>
    <path d="M36 28v20M26 38h20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="68" y="42" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">API Gateway &amp; Reverse Proxy</text>
    <text x="68" y="58" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#E5E5E5">SSL Termination • Rate Limiting • Routing</text>
    <rect x="260" y="16" width="64" height="18" rx="4" fill="#44484A"/>
    <text x="270" y="29" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">REST / WS</text>
  </g>

  <!-- Flanking Left: Auth & Security Node -->
  <g transform="translate(50, 222)">
    <rect width="150" height="62" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <rect x="12" y="16" width="28" height="28" rx="6" fill="#F7F7F5" stroke="#E5E5E5"/>
    <path d="M26 23c4 0 7 2 7 5v5c0 4-3 7-7 8-4-1-7-4-7-8v-5c0-3 3-5 7-5z" stroke="#222526" stroke-width="1.2" fill="none"/>
    <text x="48" y="33" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#222526">Auth Service</text>
    <text x="48" y="48" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#777777">JWT / OAuth2</text>
  </g>

  <!-- Connector: API Gateway <-> Auth -->
  <path d="M230 253 H205" stroke="#777777" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Flanking Right: Async Workers & Queues -->
  <g transform="translate(600, 222)">
    <rect width="150" height="62" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <rect x="12" y="16" width="28" height="28" rx="6" fill="#F7F7F5" stroke="#E5E5E5"/>
    <path d="M20 28h12M20 34h8M20 40h12" stroke="#222526" stroke-width="1.5" stroke-linecap="round"/>
    <text x="48" y="33" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#222526">Job Queues</text>
    <text x="48" y="48" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#777777">Redis Workers</text>
  </g>

  <!-- Connector: API Gateway <-> Queue -->
  <path d="M570 253 H595" stroke="#777777" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Connector Line 2: Gateway to Core Backend -->
  <path d="M400 292 v40" stroke="#777777" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <circle cx="400" cy="292" r="3" fill="#222526"/>

  <!-- 3. Core Backend Services Cluster -->
  <g transform="translate(180, 335)">
    <rect width="440" height="94" rx="14" fill="#FFFFFF" stroke="#222526" stroke-width="1.5"/>
    <rect x="16" y="14" width="124" height="22" rx="6" fill="#F7F7F5" stroke="#E5E5E5"/>
    <text x="26" y="29" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#222526">APPLICATION CORE</text>

    <!-- Sub-modules -->
    <rect x="16" y="44" width="128" height="38" rx="6" fill="#F1F1F1" stroke="#E5E5E5"/>
    <text x="28" y="60" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#222526">Business Logic</text>
    <text x="28" y="73" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#777777">Laravel / PHP</text>

    <rect x="156" y="44" width="128" height="38" rx="6" fill="#F1F1F1" stroke="#E5E5E5"/>
    <text x="168" y="60" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#222526">Domain Services</text>
    <text x="168" y="73" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#777777">Workflows &amp; Events</text>

    <rect x="296" y="44" width="128" height="38" rx="6" fill="#F1F1F1" stroke="#E5E5E5"/>
    <text x="308" y="60" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#222526">Integrations</text>
    <text x="308" y="73" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#777777">Stripe • AWS • Mail</text>
  </g>

  <!-- Connector Line 3: Backend to Database Tier -->
  <!-- Left to Primary DB -->
  <path d="M290 430 v44 h -30 v 15" stroke="#777777" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- Right to Cache -->
  <path d="M510 430 v44 h 30 v 15" stroke="#777777" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- 4. Bottom Tier: Data Storage & Persistence -->
  <!-- Database 1: Relational DB (PostgreSQL / MySQL) -->
  <g transform="translate(160, 492)">
    <rect width="200" height="92" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <!-- Cylinder Icon -->
    <ellipse cx="32" cy="30" rx="14" ry="5" fill="#F1F1F1" stroke="#222526" stroke-width="1.2"/>
    <path d="M18 30v14c0 2.8 6.3 5 14 5s14-2.2 14-5V30" fill="#F1F1F1" stroke="#222526" stroke-width="1.2"/>
    <path d="M18 37c0 2.8 6.3 5 14 5s14-2.2 14-5" stroke="#222526" stroke-width="1.2" fill="none"/>
    
    <text x="58" y="34" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#111111">Relational Database</text>
    <text x="58" y="49" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#777777">PostgreSQL / MySQL</text>
    <line x1="16" y1="62" x2="184" y2="62" stroke="#F1F1F1" stroke-width="1"/>
    <text x="20" y="78" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#555555">Automated Backups • Encryption</text>
  </g>

  <!-- Database 2: In-Memory Cache (Redis) -->
  <g transform="translate(440, 492)">
    <rect width="200" height="92" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <!-- Memory stack icon -->
    <rect x="20" y="24" width="24" height="8" rx="2" fill="#F1F1F1" stroke="#222526" stroke-width="1.2"/>
    <rect x="20" y="36" width="24" height="8" rx="2" fill="#F1F1F1" stroke="#222526" stroke-width="1.2"/>
    <rect x="20" y="48" width="24" height="8" rx="2" fill="#F1F1F1" stroke="#222526" stroke-width="1.2"/>

    <text x="56" y="34" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#111111">In-Memory Cache</text>
    <text x="56" y="49" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#777777">Redis Cluster / Session</text>
    <line x1="16" y1="62" x2="184" y2="62" stroke="#F1F1F1" stroke-width="1"/>
    <text x="20" y="78" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#555555">Sub-millisecond Latency</text>
  </g>

</svg>