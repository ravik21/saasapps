<svg width="920" height="760" viewBox="0 0 920 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="156" y="122" width="608" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas: Clean neutral off-white -->
  <rect width="920" height="760" rx="40" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="2"/>

  <!-- Subtle Monochrome Blueprint Geometry & Crosshairs (Replaces green/cyan circles) -->
  <circle cx="138" cy="124" r="72" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="786" cy="620" r="88" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1.5" stroke-dasharray="4 6"/>
  <path d="M126 124H150M138 112V136" stroke="#D4D4D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M774 620H798M786 608V632" stroke="#D4D4D4" stroke-width="2" stroke-linecap="round"/>

  <!-- Main System / Browser Window Container -->
  <g filter="url(#cardShadow)">
    <rect x="176" y="142" width="568" height="420" rx="34" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>

    <!-- Window Header / Title Bar (Solid Charcoal) -->
    <rect x="214" y="180" width="492" height="44" rx="16" fill="#171717"/>

    <!-- Monochrome Window Control Dots (Subtle Grays) -->
    <circle cx="246" cy="202" r="6" fill="#525252"/>
    <circle cx="268" cy="202" r="6" fill="#383838"/>
    <circle cx="290" cy="202" r="6" fill="#262626"/>

    <!-- Header Search / URL Breadcrumb Bar -->
    <rect x="330" y="191" width="230" height="22" rx="11" fill="#262626"/>
    <rect x="348" y="198" width="120" height="8" rx="4" fill="#737373"/>
    <circle cx="544" cy="202" r="3" fill="#A3A3A3"/>

    <!-- Header Action Pill -->
    <rect x="636" y="191" width="54" height="22" rx="11" fill="#262626"/>
    <rect x="650" y="198" width="26" height="8" rx="4" fill="#A3A3A3"/>

    <!-- Left Modular Card: System Specification & Workflow (White / Charcoal) -->
    <rect x="214" y="256" width="220" height="268" rx="28" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <rect x="242" y="286" width="102" height="14" rx="7" fill="#171717"/>
    <rect x="242" y="316" width="154" height="10" rx="5" fill="#D4D4D4"/>

    <!-- Inner Architecture Preview Container -->
    <rect x="242" y="356" width="164" height="116" rx="22" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1.5"/>
    <path d="M266 388H378" stroke="#171717" stroke-width="7" stroke-linecap="round"/>
    <path d="M266 414H346" stroke="#737373" stroke-width="7" stroke-linecap="round"/>
    <path d="M266 440H320" stroke="#D4D4D4" stroke-width="7" stroke-linecap="round"/>

    <!-- Spec Badges / Status Pills -->
    <rect x="242" y="490" width="70" height="16" rx="8" fill="#F5F5F5"/>
    <rect x="252" y="495" width="50" height="6" rx="3" fill="#A3A3A3"/>
    <rect x="320" y="490" width="60" height="16" rx="8" fill="#F5F5F5"/>
    <rect x="330" y="495" width="40" height="6" rx="3" fill="#D4D4D4"/>

    <!-- Right Top Modular Card: Core Processing Engine (High-Impact Charcoal) -->
    <rect x="466" y="256" width="240" height="116" rx="28" fill="#171717"/>
    <rect x="494" y="286" width="112" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="494" y="316" width="156" height="10" rx="5" fill="#737373"/>
    <circle cx="664" cy="314" r="14" fill="#262626"/>
    <circle cx="664" cy="314" r="5" fill="#FFFFFF"/>

    <!-- Right Bottom Modular Card: Action & Production Pipeline (White / Charcoal) -->
    <rect x="466" y="394" width="240" height="130" rx="28" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <rect x="498" y="426" width="104" height="14" rx="7" fill="#171717"/>
    <rect x="498" y="456" width="140" height="10" rx="5" fill="#A3A3A3"/>
    <rect x="498" y="478" width="88" height="8" rx="4" fill="#D4D4D4"/>

    <!-- High-Contrast Plus Button in Solid Charcoal -->
    <circle cx="640" cy="458" r="24" fill="#171717"/>
    <path d="M628 458H652" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M640 446V470" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Architectural Connector Lines (Monochrome Charcoal) -->
    <path d="M434 314H466" stroke="#171717" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
    <path d="M586 372V394" stroke="#171717" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
  </g>
</svg>
